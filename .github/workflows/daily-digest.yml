name: Daily digest

on:
  schedule:
    # 11:07 UTC ≈ 7:07am New York (EDT) / 6:07am (EST). GitHub cron is UTC.
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only (don't send email)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send digest
        env:
          # Decrypts credentials.enc (SMTP login, recipient, API keys).
          DIGEST_SECRET_KEY: ${{ secrets.DIGEST_SECRET_KEY }}
        run: python -m digest ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Upload rendered email
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
